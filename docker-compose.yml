services:
  reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: reviewer:latest
    container_name: pr-reviewer
    env_file:
      - .env
    volumes:
      # Mount current workspace or local repository
      - ./:/workspace
      # Optional: persist agy history and cache across container restarts
      - reviewer-home:/home/agyuser
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  reviewer-home:
